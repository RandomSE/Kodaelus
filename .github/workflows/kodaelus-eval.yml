name: Kodaelus eval

on:
  push:
    branches: [main]
    paths:
      - "kodaelus/**"
      - "tools/**"
      - "evals/**"
      - "install/lib/kodaelus-eval.mjs"
      - "install/lib/kodaelus-eval.test.mjs"
      - "scripts/kodaelus-eval.mjs"
  pull_request:
    paths:
      - "kodaelus/**"
      - "tools/**"
      - "evals/**"
      - "install/lib/kodaelus-eval.mjs"
      - "install/lib/kodaelus-eval.test.mjs"
      - "scripts/kodaelus-eval.mjs"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Transcript guard
        run: node tools/kodaelus-eval.mjs evals
